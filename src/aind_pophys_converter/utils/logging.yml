# Logging configuration for aind-pophys-converter (logging.config.dictConfig).
#
# Uses log-schema (PyPI: log-schema, import: log_schema) for the JSON
# formatter. Loaded by log_schema.main.setup_logging() at the entry
# points (job.run() and bergamo_stitcher.__main__). Static fields
# such as acquisition_name / process_name are injected by setup_logging()
# via the model= argument; they show up on every log line emitted under
# the root logger.
#
# The cloudwatch handler sends structured logs to the AIND log group
# (aind/internal-logs); it is no-op outside Code Ocean if AWS credentials
# are unavailable (watchtower handles the failure path).

version: 1
disable_existing_loggers: false

formatters:
  default:
    (): log_schema.main.DefaultFormatter

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    level: INFO
    stream: ext://sys.stdout
  cloudwatch:
    class: watchtower.CloudWatchLogHandler
    formatter: default
    level: INFO
    log_group_name: aind/internal-logs
    # stream_name defaults to the host/instance; override per-process if desired
    send_interval: 10
    create_log_group: true

loggers:
  "":
    handlers:
      - console
      - cloudwatch
    level: INFO
    propagate: true
