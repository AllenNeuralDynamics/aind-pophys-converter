[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-pophys-converter"
description = "Generated from aind-library-template"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
dynamic = ["version"]

dependencies = [
    'aind-data-schema==2.6.0',
    'aind-data-schema-models==5.4.1',
    'aind-ophys-utils==0.0.8',
    'aind-qcportal-schema==0.6.4',
    'h5py==3.16.0',
    'numpy>=1.26',
    'Pillow==12.1.1',
    'pydantic==2.11.10',
    'pydantic-settings==2.8.1',
    'python-dateutil==2.9.0.post0',
    'pytz==2025.2',
    'scikit-image>=0.25.0',
    'tifffile==2024.2.12',
    'scanimage-tiff-reader==1.4.1.4'
]

[project.optional-dependencies]
dev = [
    'aind-pophys-converter[full]',
    'black',
    'coverage',
    'flake8',
    'interrogate',
    'isort',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aind_pophys_converter.__version__"}

[tool.black]
line-length = 79
target_version = ['py310']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
  )/
  | .gitignore
)
'''

[tool.coverage.run]
omit = ["*__init__*"]
source = ["aind_pophys_converter", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "pragma: no cover"
]
fail_under = 85

[tool.isort]
line_length = 79
profile = "black"

[tool.interrogate]
exclude = ["setup.py", "docs", "build"]
fail-under = 100
