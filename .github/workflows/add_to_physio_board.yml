name: Add Issue to aind-physio-arch board

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add to project with labels (GraphQL method)
        if: true  # Changed from false to true
        run: |
          # Step 1: Add issue to project and capture the item ID
          ITEM_ID=$(gh api graphql -f query='
            mutation($project:ID!, $item:ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $item}) {
                item {
                  id
                }
              }
            }' -f project="PVT_kwDOBa47bs4AhzQZ" -f item="${{ github.event.issue.node_id }}" --jq '.data.addProjectV2ItemById.item.id')
          
          # Step 2: Set field value using the captured item ID
          gh api graphql -f query='
            mutation($project:ID!, $item:ID!, $field:ID!, $value:String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $field
                value: {text: $value}
              }) {
                projectV2Item {
                  id
                }
              }
            }' -f project="PVT_kwDOBa47bs4AhzQZ" -f item="$ITEM_ID" -f field="PVTSSF_lADOBa47bs4AhzQZzgcOjdk" -f value="ophys"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}