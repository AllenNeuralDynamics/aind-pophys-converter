name: Add Issue to aind-physio-arch board

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add to project with labels (GraphQL method)
        if: false  # Set to true to use this method instead
        run: |
          gh api graphql -f query='
            mutation($project:ID!, $item:ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $item}) {
                item {
                  id
                }
              }
            }' -f project="PVT_kwDOBa47bs4AhzQZ" -f item="${{ github.event.issue.node_id }}"
          
          # Add labels to the project item
          gh api graphql -f query='
            mutation($project:ID!, $item:ID!, $field:ID!, $value:String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $field
                value: {text: $value}
              }) {
                projectV2Item {
                  id
                }
              }
            }' -f project="PVT_kwDOBa47bs4AhzQZ" -f item="PVTSSF_lADOBa47bs4AhzQZzgcOjdk" -f field="8fab6831" -f value="new-issue"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}